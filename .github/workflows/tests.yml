name: Tests

# All tests, on demand only: comment "/test" on a pull request (write access needed), or run it from
# the Actions tab / `gh workflow run tests.yml -f ref=<branch>`.
# Unit tests: the JVM tests (gradle testDebugUnitTest).
# End-to-end tests: boots a Wear OS emulator, installs the debug build with the demo collection and drives the app
# from outside via adb: gesture test (25 cases; the full grid is the JVM GesturesTest) and flow test
# (sync with a real Anki sync server, rendering, rating, undo, conflict).
# Runs on Wear OS 7 (like the target watch) and Wear OS 5 (older generation still in wide use).
# The combined result is posted as commit status "tests" on the tested commit, which branch protection
# requires before a pull request can be merged.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test (for a pull request: its head branch)"
        required: true
        default: main

permissions:
  contents: read
  statuses: write
  pull-requests: write   # reaction on the /test comment (comments on PRs need this, not just issues)
  issues: write          # reaction on the /test comment

concurrency:
  # Every PR comment starts this workflow; only real "/test" runs share a group, so other comments
  # (e.g. "/screens") cannot cancel a running test.
  group: tests-${{ github.event.issue.number || inputs.ref }}-${{ github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/test') }}
  cancel-in-progress: true

env:
  EMULATOR_OPTIONS: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -camera-back none
  # avdmanager 22.0 and the emulator default to different AVD directories; pin one for both and the cache.
  ANDROID_AVD_HOME: /home/runner/.android/avd
  GH_TOKEN: ${{ github.token }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  start:
    # A "/test" comment on a pull request by someone with write access (the PR code is built and run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/test') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Pull request head
        id: pr
        if: github.event_name == 'issue_comment'
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" > pr.json
          # Code from forks is never built here.
          if [ "$(jq -r .head.repo.full_name pr.json)" != "${{ github.repository }}" ]; then
            echo "Pull request from a fork; not building it." >&2; exit 1
          fi
          echo "head=$(jq -r .head.sha pr.json)" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket > /dev/null || echo "Could not react to the comment" >&2
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head || inputs.ref }}
      - name: Mark commit status pending
        id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/statuses/$sha" -f state=pending -f context=tests \
            -f description="Tests running" -f target_url="$RUN_URL"

  unit:
    needs: start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.start.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.1
            /usr/local/lib/android/sdk/build-tools/37.0.0
          key: android-sdk-37.1-bt37.0.0
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

  # The debug APK is built once per run, and not at all if this commit was built before (cache).
  build:
    needs: start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.start.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.1
            /usr/local/lib/android/sdk/build-tools/37.0.0
          key: android-sdk-37.1-bt37.0.0
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      # Built-in debug account for the local sync server; the emulator reaches the runner as 10.0.2.2.
      - name: Debug APK
        id: apk
        uses: ./.github/actions/debug-apk
        with:
          dir: .
          sync-endpoint: http://10.0.2.2:27701/
          sync-user: ci
          sync-password: ci
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 1

  emulator:
    needs: [start, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Wear OS 7 like on the target watch: there, swiping back is a system gesture.
          # Only signed images exist for Wear OS 6+.
          - name: wear-os-7
            api: "37.0"
            tag: android-wear-signed
          # Wear OS 5 still uses the old window swipe-to-dismiss; the test skips the one case it swallows.
          - name: wear-os-5
            api: "34"
            tag: android-wear
    name: ${{ matrix.name }}
    env:
      SYSTEM_IMAGE: system-images;android-${{ matrix.api }};${{ matrix.tag }};x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.start.outputs.sha }}
      # Only sdkmanager is needed here (emulator and system image); the APK comes from the build job.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: /tmp/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Demo collection and sync server
        run: |
          python3 -m venv /tmp/anki && /tmp/anki/bin/pip install --quiet anki
          mkdir -p /tmp/demo /tmp/syncserver
          /tmp/anki/bin/python -I ci/make_demo_collection.py /tmp/demo/collection.anki2
          SYNC_USER1=ci:ci SYNC_BASE=/tmp/syncserver SYNC_HOST=0.0.0.0 SYNC_PORT=27701 \
            nohup /tmp/anki/bin/python -m anki.syncserver > syncserver.log 2>&1 &
      # sdkmanager/avdmanager before cmdline-tools 22.0 install the API 37.0 image incompletely and write
      # "target=android-0"; the guest graphics driver then crashes in a loop. So both come from 22.0
      # and the AVD target is checked.
      - name: Install emulator and system image
        run: |
          yes | sdkmanager --install "cmdline-tools;22.0" > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" --install emulator "$SYSTEM_IMAGE" > /dev/null
          ls "$ANDROID_HOME/system-images/android-${{ matrix.api }}/${{ matrix.tag }}/x86_64"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      # Cold boot only once: later runs resume from the cached quick-boot snapshot.
      - name: AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          # The snapshot only trusts the adb key it was created with, so the key is cached alongside.
          path: |
            ~/.android/avd
            ~/.android/adbkey
            ~/.android/adbkey.pub
          key: avd-${{ matrix.api }}-${{ matrix.tag }}-2048-v2
      - name: Create AVD and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -x
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/22.0/bin/avdmanager" create avd -n wear -k "$SYSTEM_IMAGE" -d wearos_large_round --force
          cat "$ANDROID_AVD_HOME/wear.ini"
          grep -q "^target=android-${{ matrix.api }}" "$ANDROID_AVD_HOME/wear.ini"
          adb start-server
          emulator -avd wear $EMULATOR_OPTIONS > emulator-cold.log 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            sleep 10; tail -n 2 emulator-cold.log
          done
          sleep 20
          adb emu kill
          while pgrep -f qemu-system > /dev/null; do sleep 2; done
      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd
            ~/.android/adbkey
            ~/.android/adbkey.pub
          key: avd-${{ matrix.api }}-${{ matrix.tag }}-2048-v2
      - name: Boot emulator
        timeout-minutes: 10
        run: |
          emulator -avd wear $EMULATOR_OPTIONS -no-snapshot-save > emulator.log 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do sleep 3; done
          # The snapshot resumes with the clock of the moment it was taken; Anki sync rejects skewed clocks.
          # Set the guest clock from the runner (works without root, also on signed images).
          adb shell settings put global auto_time 0
          adb shell cmd alarm set-time "$(date +%s%3N)"
          # Older images ignore that; they are not signed, so set the clock as root there.
          skew=$(( $(date +%s) - $(adb shell date +%s | tr -d '\r') ))
          if [ "${skew#-}" -gt 30 ]; then
            adb root && sleep 3 && adb wait-for-device
            adb shell date "@$(date +%s)"
          fi
          echo "runner $(date -u +%FT%TZ) emulator $(adb shell date -u +%FT%TZ)"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size
      - name: Install app and test data
        run: |
          adb install -r /tmp/apk/app-debug.apk
          adb shell mkdir -p /data/local/tmp/ci
          adb push /tmp/demo/collection.anki2 /data/local/tmp/ci/collection.anki2
          adb shell chmod -R 755 /data/local/tmp/ci
          adb shell cmd locale set-app-locales de.mcdax.wristcards --locales en-US
      - name: Gesture test
        shell: bash
        run: python3 ci/swipe_test.py emulator-5554 Spanish | tee swipe-test.log
      - name: Flow test
        if: success() || failure()
        shell: bash
        run: /tmp/anki/bin/python -u ci/flow_test.py emulator-5554 http://127.0.0.1:27701/ ci:ci /tmp/demo/collection.anki2 | tee flow-test.log
      - name: Collect logs
        if: always()
        run: timeout 30 adb logcat -d > logcat.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-logs-${{ matrix.name }}
          path: |
            swipe-test.log
            flow-test.log
            flow-fail-*.png
            syncserver.log
            logcat.txt
            emulator*.log
          retention-days: 7
          if-no-files-found: ignore

  report:
    needs: [start, unit, build, emulator]
    if: always() && needs.start.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - name: Report commit status
        run: |
          if [ "${{ needs.unit.result }}" != success ]; then
            state=failure; text="Unit tests failed, see run"
          elif [ "${{ needs.emulator.result }}" != success ]; then
            state=failure; text="Emulator tests failed, see run"
          else
            state=success; text="Unit, gesture and flow tests passed (Wear OS 7 and 5)"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ needs.start.outputs.sha }}" -f state="$state" -f context=tests \
            -f description="$text" -f target_url="$RUN_URL"
