name: CI

# Only on demand (Actions tab / gh workflow run) and for release tags, not on every push.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Cache platform and build tools; setup-android would otherwise download them on every run.
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.1
            /usr/local/lib/android/sdk/build-tools/37.0.0
          key: android-sdk-37.1-bt37.0.0
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest
      - name: Release build (R8)
        run: ./gradlew --console=plain assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: wristcards-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
