name: E2E tests (emulator)

# End-to-end test, manual only (Actions tab or `gh workflow run e2e.yml -f ref=<branch>`).
# Boots a Wear OS emulator, installs the debug build with the demo collection and drives the app
# from outside via adb (swipe/gesture regression test). The result is posted as commit status
# "e2e" on the tested commit, which branch protection requires before a pull request can be merged.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test (for a pull request: its head branch)"
        required: true
        default: main
      mode:
        description: full (all gesture cases) or quick (core cases only)
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: read
  statuses: write

concurrency:
  group: e2e-${{ inputs.ref }}
  cancel-in-progress: true

# Unsigned Wear OS 5 image: boots much faster than the signed Wear OS 6/7 images and allows snapshots.
env:
  API_LEVEL: 34
  TARGET: android-wear
  ARCH: x86_64
  PROFILE: wearos_large_round
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Mark commit status pending
        run: |
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" -f state=pending -f context=e2e \
            -f description="E2E tests (${{ inputs.mode }}) running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.1
            /usr/local/lib/android/sdk/build-tools/37.0.0
          key: android-sdk-37.1-bt37.0.0
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The sync account is a placeholder: the test only needs the app to count as signed in.
      # Sync on open / on deck exit is switched off by the test, so nothing is ever contacted.
      - name: Build debug APK
        run: |
          printf 'sync.endpoint=http://127.0.0.1:9/\nsync.user=ci\nsync.password=ci\n' > local.properties
          ./gradlew --console=plain assembleDebug
      - name: Build demo collection
        run: |
          python3 -m venv /tmp/anki && /tmp/anki/bin/pip install --quiet anki
          /tmp/anki/bin/python -I ci/make_demo_collection.py /tmp/collection.anki2
      # Cold boot only once: later runs resume from the cached AVD snapshot.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: Swipe test (${{ inputs.mode }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: |
            adb shell wm size
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell mkdir -p /data/local/tmp/ci
            adb push /tmp/collection.anki2 /data/local/tmp/ci/collection.anki2
            adb shell chmod -R 755 /data/local/tmp/ci
            adb shell cmd locale set-app-locales de.mcdax.wristcards --locales en-US || true
            bash -o pipefail -c "python3 ci/swipe_test.py emulator-5554 Spanish ${{ inputs.mode == 'quick' && 'quick' || '' }} | tee swipe-test.log; rc=\$?; adb logcat -d > logcat.txt; exit \$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: |
            swipe-test.log
            logcat.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Report commit status
        if: always() && env.SHA != ''
        run: |
          state=${{ job.status == 'success' && 'success' || 'failure' }}
          summary=$(grep '^SUMMARY' swipe-test.log 2>/dev/null | cut -c9- || true)
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state="$state" -f context=e2e \
            -f description="${summary:-E2E tests ${state}} (${{ inputs.mode }})" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
