name: E2E tests (emulator)

# End-to-end test, manual only (Actions tab or `gh workflow run e2e.yml -f ref=<branch>`).
# Boots a Wear OS emulator, installs the debug build with the demo collection and drives the app
# from outside via adb (swipe/gesture regression test). The result is posted as commit status
# "e2e" on the tested commit, which branch protection requires before a pull request can be merged.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test (for a pull request: its head branch)"
        required: true
        default: main
      mode:
        description: full (all gesture cases) or quick (core cases only)
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: read
  statuses: write

concurrency:
  group: e2e-${{ inputs.ref }}
  cancel-in-progress: true

# Wear OS 7 like on the target watch: there, swiping back is a system gesture (Wear OS 5 still uses
# the old window swipe-to-dismiss, which behaves differently). Only signed images exist for Wear OS 6+.
env:
  SYSTEM_IMAGE: "system-images;android-37.0;android-wear-signed;x86_64"
  EMULATOR_OPTIONS: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -camera-back none
  # avdmanager 22.0 and the emulator default to different AVD directories; pin one for both and the cache.
  ANDROID_AVD_HOME: /home/runner/.android/avd

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Mark commit status pending
        run: |
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" -f state=pending -f context=e2e \
            -f description="E2E tests (${{ inputs.mode }}) running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.1
            /usr/local/lib/android/sdk/build-tools/37.0.0
          key: android-sdk-37.1-bt37.0.0
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The sync account is a placeholder: the test only needs the app to count as signed in.
      # Sync on open / on deck exit is switched off by the test, so nothing is ever contacted.
      - name: Build debug APK
        run: |
          printf 'sync.endpoint=http://127.0.0.1:9/\nsync.user=ci\nsync.password=ci\n' > local.properties
          ./gradlew --console=plain assembleDebug
      - name: Build demo collection
        run: |
          python3 -m venv /tmp/anki && /tmp/anki/bin/pip install --quiet anki
          /tmp/anki/bin/python -I ci/make_demo_collection.py /tmp/collection.anki2
      # sdkmanager/avdmanager before cmdline-tools 22.0 install the API 37.0 image incompletely and write
      # "target=android-0"; the guest graphics driver then crashes in a loop. So both come from 22.0
      # and the AVD target is checked.
      - name: Install emulator and system image
        run: |
          yes | sdkmanager --install "cmdline-tools;22.0" > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" --install emulator "$SYSTEM_IMAGE" > /dev/null
          ls "$ANDROID_HOME/system-images/android-37.0/android-wear-signed/x86_64"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      # Cold boot only once: later runs resume from the cached quick-boot snapshot.
      - name: AVD cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: ~/.android/avd
          key: avd-wear37-2048-v1
      - name: Create AVD and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -x
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/22.0/bin/avdmanager" create avd -n wear -k "$SYSTEM_IMAGE" -d wearos_large_round --force
          cat "$ANDROID_AVD_HOME/wear.ini"
          grep -q "^target=android-37.0" "$ANDROID_AVD_HOME/wear.ini"
          emulator -avd wear $EMULATOR_OPTIONS > emulator-cold.log 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            sleep 10; tail -n 2 emulator-cold.log
          done
          sleep 20
          adb emu kill
          while pgrep -f qemu-system > /dev/null; do sleep 2; done
      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/avd
          key: avd-wear37-2048-v1
      - name: Boot emulator
        timeout-minutes: 10
        run: |
          emulator -avd wear $EMULATOR_OPTIONS -no-snapshot-save > emulator.log 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do sleep 3; done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size
      - name: Install app and test data
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell mkdir -p /data/local/tmp/ci
          adb push /tmp/collection.anki2 /data/local/tmp/ci/collection.anki2
          adb shell chmod -R 755 /data/local/tmp/ci
          adb shell cmd locale set-app-locales de.mcdax.wristcards --locales en-US
      - name: Swipe test (${{ inputs.mode }})
        shell: bash
        run: python3 ci/swipe_test.py emulator-5554 Spanish ${{ inputs.mode == 'quick' && 'quick' || '' }} | tee swipe-test.log
      - name: Collect logs
        if: always()
        run: timeout 30 adb logcat -d > logcat.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: |
            swipe-test.log
            logcat.txt
            emulator*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Report commit status
        if: always() && env.SHA != ''
        run: |
          state=${{ job.status == 'success' && 'success' || 'failure' }}
          summary=$(grep '^SUMMARY' swipe-test.log 2>/dev/null | cut -c9- || true)
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state="$state" -f context=e2e \
            -f description="${summary:-E2E tests ${state}} (${{ inputs.mode }})" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
