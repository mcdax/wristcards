name: Screenshots (before/after)

# Comment "/screens" on a pull request (needs write access), optionally followed by groups or screen names
# ("/screens study image"), or run it from the Actions tab with the PR number. Builds the base branch and the
# pull request, takes the screens from ci/screens.json on several watch sizes in the emulator (one runner
# per group, in parallel) and posts before/after collages in one PR comment; screens not taken in a run keep
# their previous collage. Not a merge gate. Scripts and tools always come from the default branch.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      only:
        description: Groups or screen names, space-separated (empty = all)
        required: false
        default: ""

permissions:
  contents: write        # collages are stored on the pr-screenshots branch
  pull-requests: write
  issues: write
  actions: write         # removes the intermediate artifacts of the run

concurrency:
  group: screens-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

env:
  SYSTEM_IMAGE: "system-images;android-37.0;android-wear-signed;x86_64"
  EMULATOR_OPTIONS: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -camera-back none
  ANDROID_AVD_HOME: /home/runner/.android/avd
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    # Only for "/screens" comments on pull requests by people with write access (the PR code is built and run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/screens') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull request
        id: pr
        run: |
          pr=${{ github.event.issue.number || inputs.pr }}
          gh api "repos/${{ github.repository }}/pulls/$pr" > pr.json
          # Code from forks is never built here.
          if [ "$(jq -r .head.repo.full_name pr.json)" != "${{ github.repository }}" ]; then
            echo "Pull request from a fork; not building it." >&2; exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.sha pr.json)" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .base.sha pr.json)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = issue_comment ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket > /dev/null || echo "Could not react to the comment" >&2
          fi
      - name: Plan
        id: plan
        env:
          SELECTION: ${{ github.event.comment.body || inputs.only }}
        run: echo "matrix=$(python3 ci/screens_plan.py "$(echo "$SELECTION" | head -1)")" >> "$GITHUB_OUTPUT"

  apks:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}
          path: after
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: before
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.1
            /usr/local/lib/android/sdk/build-tools/37.0.0
          key: android-sdk-37.1-bt37.0.0
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      # Built only if no APK of the same sources is cached; the base side is usually cached after the first run.
      # Neutral built-in account: it prefills the sign-in form in the screenshots; nothing is contacted.
      - name: APK before
        id: before
        uses: ./tools/.github/actions/debug-apk
        with:
          dir: before
          sync-endpoint: https://sync.example.org/
          sync-user: demo
          sync-password: demo
      - name: APK after
        id: after
        uses: ./tools/.github/actions/debug-apk
        with:
          dir: after
          sync-endpoint: https://sync.example.org/
          sync-user: demo
          sync-password: demo
      - name: Collect
        run: mkdir -p apks && cp "${{ steps.before.outputs.apk }}" apks/before.apk && cp "${{ steps.after.outputs.apk }}" apks/after.apk
      - uses: actions/upload-artifact@v7
        with:
          name: screens-apks
          path: apks
          retention-days: 1

  shots:
    needs: [plan, apks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: shots (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v8
        with:
          name: screens-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Demo collection
        run: |
          python3 -m venv /tmp/py && /tmp/py/bin/pip install --quiet anki
          mkdir -p /tmp/demo && /tmp/py/bin/python -I ci/make_demo_collection.py /tmp/demo/collection.anki2
      # Same emulator and snapshot cache as the e2e workflow (see there for why cmdline-tools 22.0).
      - name: Install emulator and system image
        run: |
          yes | sdkmanager --install "cmdline-tools;22.0" > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" --install emulator "$SYSTEM_IMAGE" > /dev/null
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd
            ~/.android/adbkey
            ~/.android/adbkey.pub
          key: avd-37.0-android-wear-signed-2048-v2
      - name: Create AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/22.0/bin/avdmanager" create avd -n wear -k "$SYSTEM_IMAGE" -d wearos_large_round --force
      - name: Boot emulator
        timeout-minutes: 15
        run: |
          emulator -avd wear $EMULATOR_OPTIONS -no-snapshot-save > emulator.log 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do sleep 3; done
          adb shell settings put global auto_time 0
          adb shell cmd alarm set-time "$(date +%s%3N)"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Screenshots
        run: |
          python3 ci/screens.py emulator-5554 apks/before.apk /tmp/demo/collection.anki2 shots/before "${{ matrix.screens }}"
          python3 ci/screens.py emulator-5554 apks/after.apk /tmp/demo/collection.anki2 shots/after "${{ matrix.screens }}"
      - uses: actions/upload-artifact@v7
        with:
          name: shots-${{ matrix.group }}
          path: shots
          retention-days: 7

  publish:
    needs: [plan, shots]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots
      - name: Collages
        run: |
          python3 -m venv /tmp/py && /tmp/py/bin/pip install --quiet pillow
          /tmp/py/bin/python ci/collage.py shots/before shots/after collages
      - name: Bundle
        run: python3 ci/screens_bundle.py shots collages bundle
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-pr-${{ needs.plan.outputs.number }}
          path: bundle
          retention-days: 14
      # Only the bundle above is meant for people; the per-group and APK artifacts were just for passing data on.
      - name: Remove intermediate artifacts
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | test("^(shots-|screens-apks$)")) | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
      - name: Post collages
        run: |
          pr=${{ needs.plan.outputs.number }}; head=${{ needs.plan.outputs.head }}; dir="pr-$pr/${head:0:7}"
          git clone --quiet --depth 1 --branch pr-screenshots "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" store \
            || { git init --quiet store && git -C store checkout --quiet --orphan pr-screenshots \
                 && git -C store remote add origin "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}"; }
          mkdir -p "store/$dir" && cp collages/*.jpg "store/$dir/"
          git -C store add -A
          git -C store -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Screenshots for #$pr at ${head:0:7}"
          git -C store push --quiet origin HEAD:pr-screenshots
          existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- wristcards-screens -->")) | .id' | tail -1)
          if [ -n "$existing" ]; then gh api "repos/${{ github.repository }}/issues/comments/$existing" --jq .body > old.md; fi
          python3 ci/screens_comment.py "${existing:+old.md}" collages \
            "https://raw.githubusercontent.com/${{ github.repository }}/pr-screenshots/$dir" "${head:0:7}" > comment.md
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$pr/comments" -F body=@comment.md > /dev/null
          fi
